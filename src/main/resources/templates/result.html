<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Готово | PDF Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f7fb;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: white;
            border-radius: 36px;
            padding: 48px 40px;
            text-align: center;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.2);
            border: 1px solid #eef2ff;
        }
        .success-icon {
            background: #dcfce7;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            margin: 0 auto 24px;
            font-size: 2.8rem;
            color: #16a34a;
        }
        h1 { font-size: 1.9rem; margin-bottom: 16px; color: #0f172a; }
        p { color: #334155; margin-bottom: 32px; font-size: 1rem; line-height: 1.5; }
        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary {
            background: #f1f5f9;
            color: #1e293b;
        }
        .btn-secondary:hover { background: #e2e8f0; }
        .timer-note {
            margin-top: 32px;
            font-size: 0.85rem;
            color: #6c757d;
        }
        @media (max-width: 480px) { .card { padding: 32px 24px; } }
    </style>
</head>
<body>
<div class="card">
    <div class="success-icon"><i class="fas fa-check-circle"></i></div>
    <h1>Готово!</h1>
    <p id="messageText"></p>
    <div class="buttons">
        <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> На головну</a>
        <a href="/merge" class="btn btn-secondary"><i class="fas fa-object-group"></i> Об'єднати</a>
        <a href="/split" class="btn btn-secondary"><i class="fas fa-cut"></i> Розділити</a>
    </div>
    <div class="timer-note"><i class="fas fa-clock"></i> Файли будуть автоматично видалені через вказаний час</div>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const msg = urlParams.get('message');
    const p = document.getElementById('messageText');
    if (msg) p.textContent = decodeURIComponent(msg);
    else p.textContent = 'Операція успішно виконана!';
</script>
</body>
</html>
