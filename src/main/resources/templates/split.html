<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розділити PDF | PDF Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f7fb; font-family: 'Segoe UI', system-ui, sans-serif; padding: 32px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid #eef2ff;
        }
        .back-link { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #4b5563; margin-bottom: 24px; font-weight: 500; }
        .back-link:hover { color: #2563eb; }
        h1 { font-size: 2rem; font-weight: 700; color: #0f172a; margin-bottom: 12px; }
        .sub { color: #5b6e8c; margin-bottom: 32px; }
        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            background: #fafcff;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-area:hover { border-color: #2563eb; }
        .upload-icon { font-size: 3rem; color: #2563eb; margin-bottom: 16px; }
        .file-info {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            margin: 20px 0;
            display: none;
            border: 1px solid #e2e8f0;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .loading { display: none; text-align: center; margin-top: 24px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .info { background: #f1f5f9; border-radius: 20px; padding: 20px; margin-top: 32px; font-size: 0.9rem; }
        .info i { margin-right: 8px; color: #2563eb; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> На головну</a>
        <h1><i class="fas fa-cut"></i> Розділити PDF</h1>
        <div class="sub">Розділіть PDF-файл на окремі сторінки</div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
            <p><strong>Натисніть або перетягніть PDF</strong></p>
            <small>Максимум 50 MB</small>
            <input type="file" id="fileInput" accept=".pdf" style="display:none">
        </div>

        <div class="file-info" id="fileInfo"></div>
        <button id="splitBtn" disabled>Розділити PDF</button>
        <div class="loading" id="loading"><div class="spinner"></div><p>Розділення...</p></div>
        <div class="info"><i class="fas fa-info-circle"></i> Кожна сторінка буде окремим PDF. Результат зберігається 30 хвилин.</div>
    </div>
</div>
<script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const splitBtn = document.getElementById('splitBtn');
    const loading = document.getElementById('loading');
    let selectedFile = null;
    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
        if(e.target.files[0]) {
            selectedFile = e.target.files[0];
            fileInfo.style.display = 'block';
            fileInfo.innerHTML = `<i class="fas fa-file-pdf"></i> <strong>${selectedFile.name}</strong> (${(selectedFile.size/1024).toFixed(1)} KB)`;
            splitBtn.disabled = false;
        }
    });
    splitBtn.addEventListener('click', async () => {
        if(!selectedFile) return;
        const fd = new FormData();
        fd.append('file', selectedFile);
        splitBtn.disabled = true;
        loading.style.display = 'block';
        try {
            const res = await fetch('/api/pdf/split', { method: 'POST', body: fd });
            if(res.ok) {
                const pages = await res.json();
                pages.forEach((pageData, idx) => {
                    const blob = new Blob([new Uint8Array(pageData)], {type: 'application/pdf'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `page_${idx+1}.pdf`;
                    a.click();
                    URL.revokeObjectURL(url);
                });
                window.location.href = `/result?message=PDF розділено на ${pages.length} сторінок! Кожна сторінка буде видалена через 30 хвилин.`;
            } else throw new Error('Помилка розділення');
        } catch(err) { alert('Помилка: '+err.message); }
        finally { loading.style.display = 'none'; splitBtn.disabled = false; }
    });
</script>
</body>
</html>
