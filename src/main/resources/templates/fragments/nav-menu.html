<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Navigation Menu Fragment</title>
    <link rel="icon" type="image/png" th:href="@{/img/ico.png}">
    <link rel="stylesheet" th:href="@{/css/nav-menu.css}">
</head>
<body>

<nav th:fragment="nav-menu" class="nav-container">
    <a href="/" class="nav-brand">
        <span>📄</span> PDF Plus
    </a>
    <ul class="nav-links">
        <li><a th:href="@{/}" th:class="${currentUri == '/'} ? 'active' : ''">Головна</a></li>
        <li><a th:href="@{/merge}" th:class="${currentUri == '/merge'} ? 'active' : ''">Об'єднати</a></li>
        <li><a th:href="@{/split}" th:class="${currentUri == '/split'} ? 'active' : ''">Розділити</a></li>
        <li><a th:href="@{/organize}" th:class="${currentUri == '/organize'} ? 'active' : ''">Організувати</a></li>
        <li><a th:href="@{/scan}" th:class="${currentUri == '/scan'} ? 'active' : ''">Сканувати</a></li>
        <li><a th:href="@{/history}" th:class="${currentUri == '/history'} ? 'active' : ''">Історія</a></li>
    </ul>
    <!-- Кнопка перемикання теми -->
    <button id="themeToggle" class="theme-toggle-nav" aria-label="Перемикання теми">
        <i class="fas fa-moon"></i> Тема
    </button>
</nav>

</body>
</html>
