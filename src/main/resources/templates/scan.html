<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Сканувати в PDF | PDF Plus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(145deg, #f0f4fa 0%, #e9eef5 100%);
            min-height: 100vh;
            padding: 32px 20px;
        }
        .container { max-width: 1280px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid #eef2ff;
        }
        h1 { font-size: 2rem; font-weight: 700; color: #0f172a; margin-bottom: 12px; }
        .sub { color: #5b6e8c; margin-bottom: 32px; }
        .info-box {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 20px;
            margin-top: 32px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Навігаційне меню -->
    <div th:replace="~{fragments/nav-menu :: nav-menu}"></div>
    
    <div class="card">
        <h1>📱 Сканировать в PDF</h1>
        <div class="sub">Функція сканування з мобільного пристрою буде доступна найближчим часом.</div>
        <div class="info-box">
            <i>ℹ️</i> Для сканування в PDF використовуйте мобільний додаток PDF Plus. Функція буде доступна найближчим часом.
        </div>
    </div>
</div>
</body>
</html>
