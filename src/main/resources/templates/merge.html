<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Об'єднати PDF файли онлайн | PDFPlus</title>
    <link rel="stylesheet" th:href="@{/css/nav-menu.css}">
    <link rel="stylesheet" th:href="@{/css/merge.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

</head>
<body>
<div class="main">
    <div th:replace="~{fragments/nav-menu :: nav-menu}"></div>

    <div class="tool tool--small">
        <div class="tool__workarea">
            <!-- Зона завантаження (прихована після додавання файлів) -->
            <div id="uploader" class="uploader">
                <div class="uploader__droptxt">📂 Перетягніть PDF файли сюди або натисніть для вибору</div>
                <input type="file" id="fileInput" multiple accept=".pdf" style="display:none">
            </div>

            <!-- Робоча область з файлами (прихована спочатку) -->
            <div id="filesContainer" class="files-grid" style="display: none;">
                <div class="empty-state">Файли не вибрано</div>
            </div>
        </div>

        <!-- Бічна панель -->
        <div class="tool__sidebar">
            <div class="tool__header">
                <h1 class="tool__header__title">Об'єднати PDF</h1>
                <h2 class="tool__header__subtitle">Об'єднуйте PDF файли та впорядковуйте їх легко і швидко в будь-якому порядку.</h2>
            </div>
            <!-- Кнопка "Додати ще файли" (спочатку прихована) -->
            <button id="addMoreFilesBtn" class="btn-add-more" style="display: none;">➕ Додати ще файли</button>
            <div class="info">
                <i class="fas fa-arrows-alt"></i>  Перетягніть файли для зміни порядку.
            </div>
            <button id="processTask" class="btn btn--process merge" disabled>
                <span>Об'єднати PDF</span>
                <svg width="24" height="24" viewBox="0 0 26 26" fill="#FFF"><path d="M13 26C5.82 26 0 20.18 0 13S5.82 0 13 0s13 5.82 13 13-5.82 13-13 13zm0-2c6.075 0 11-4.925 11-11S19.075 2 13 2 2 6.925 2 13s4.925 11 11 11z"/><path d="M18.684 13.105a.55.55 0 0 1-.148.378l-5.263 5.263a.55.55 0 0 1-.378.148.54.54 0 0 1-.526-.526V15.21H7.842a.54.54 0 0 1-.526-.526v-3.158A.54.54 0 0 1 7.842 11h4.526V7.842a.52.52 0 0 1 .526-.526c.148 0 .28.066.395.164l5.247 5.247a.55.55 0 0 1 .148.378z"/></svg>
            </button>
            <div class="progress-container" id="progressContainer"><div class="progress-bar" id="progressBar"></div></div>
            <div id="statusMessage" class="status-message"></div>
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let selectedFiles = [];
    let sortable = null;

    const uploader = document.getElementById('uploader');
    const fileInput = document.getElementById('fileInput');
    const filesContainer = document.getElementById('filesContainer');
    const mergeBtn = document.getElementById('processTask');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const statusDiv = document.getElementById('statusMessage');
    const addMoreBtn = document.getElementById('addMoreFilesBtn');

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function showMessage(msg, type) {
        statusDiv.innerHTML = `<div style="color:${type === 'error' ? '#b91c1c' : '#15803d'}">${msg}</div>`;
        setTimeout(() => { if (statusDiv.innerHTML.includes(msg)) statusDiv.innerHTML = ''; }, 4000);
    }

    async function generateThumbnail(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const pdf = await pdfjsLib.getDocument({ data: e.target.result }).promise;
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({ scale: 0.4 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    resolve(canvas.toDataURL());
                } catch (err) { reject(err); }
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }

    async function rotateFile(file, angle) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('angle', angle);
        const res = await fetch('/api/pdf/rotate', { method: 'POST', body: formData });
        if (!res.ok) throw new Error('Помилка повороту');
        const blob = await res.blob();
        return new File([blob], file.name, { type: 'application/pdf' });
    }

    async function addFiles(newFiles) {
        let added = 0;
        for (const file of newFiles) {
            if (file.type !== 'application/pdf') { showMessage(`Файл "${file.name}" не є PDF`, 'error'); continue; }
            if (selectedFiles.some(f => f.file.name === file.name && f.file.size === file.size)) { showMessage(`Файл "${file.name}" вже доданий`, 'error'); continue; }
            try {
                const thumb = await generateThumbnail(file);
                selectedFiles.push({ file, thumbnailUrl: thumb, name: file.name, size: file.size });
                added++;
            } catch (err) { showMessage(`Помилка обробки ${file.name}: ${err.message}`, 'error'); }
        }
        if (added > 0) {
            // Після додавання першого файлу ховаємо uploader і показуємо filesContainer та кнопку "Додати ще"
            if (selectedFiles.length > 0) {
                uploader.style.display = 'none';
                filesContainer.style.display = 'flex';
                addMoreBtn.style.display = 'block';
            }
            renderFilesGrid();
            updateMergeButton();
        }
    }

    async function removeFile(index) {
        selectedFiles.splice(index, 1);
        if (selectedFiles.length === 0) {
            // Якщо файлів більше немає, повертаємо uploader і ховаємо робочу область та кнопку
            uploader.style.display = 'block';
            filesContainer.style.display = 'none';
            addMoreBtn.style.display = 'none';
        }
        renderFilesGrid();
        updateMergeButton();
    }

    async function rotateFileAtIndex(index) {
        const item = selectedFiles[index];
        if (!item) return;
        try {
            const rotatedFile = await rotateFile(item.file, 90);
            const newThumb = await generateThumbnail(rotatedFile);
            selectedFiles[index] = { ...item, file: rotatedFile, thumbnailUrl: newThumb };
            renderFilesGrid();
            showMessage(`Файл "${item.name}" повернуто`, 'success');
        } catch (err) { showMessage(`Помилка повороту: ${err.message}`, 'error'); }
    }

    function initSortable() {
        if (sortable) sortable.destroy();
        if (!filesContainer) return;
        sortable = new Sortable(filesContainer, {
            animation: 200,
            onEnd: function() {
                const items = filesContainer.querySelectorAll('.file-card');
                const newOrder = [];
                items.forEach(item => {
                    const oldIdx = parseInt(item.getAttribute('data-index'), 10);
                    if (!isNaN(oldIdx) && selectedFiles[oldIdx]) newOrder.push(selectedFiles[oldIdx]);
                });
                if (newOrder.length === selectedFiles.length) {
                    selectedFiles = newOrder;
                }
                items.forEach((item, newIdx) => {
                    item.setAttribute('data-index', newIdx);
                });
                updateMergeButton();
            }
        });
    }

    function renderFilesGrid() {
        filesContainer.innerHTML = '';
        if (selectedFiles.length === 0) {
            filesContainer.innerHTML = '<div class="empty-state">Файли не вибрано</div>';
            if (sortable) sortable.destroy();
            sortable = null;
            return;
        }

        for (let i = 0; i < selectedFiles.length; i++) {
            const data = selectedFiles[i];
            const card = document.createElement('div');
            card.className = 'file-card';
            card.setAttribute('data-index', i);

            const dragHandle = document.createElement('div');
            dragHandle.className = 'drag-handle';
            dragHandle.innerHTML = '<i class="fas fa-grip-vertical"></i>';
            card.appendChild(dragHandle);

            const actions = document.createElement('div');
            actions.className = 'file__actions';
            const rotateBtn = document.createElement('a');
            rotateBtn.className = 'file__btn rotate';
            rotateBtn.innerHTML = '<i class="fas fa-undo-alt"></i>';
            rotateBtn.href = 'javascript:;';
            rotateBtn.onclick = async (e) => { e.stopPropagation(); await rotateFileAtIndex(i); };
            const removeBtn = document.createElement('a');
            removeBtn.className = 'file__btn remove';
            removeBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            removeBtn.href = 'javascript:;';
            removeBtn.onclick = (e) => { e.stopPropagation(); removeFile(i); };
            actions.appendChild(rotateBtn);
            actions.appendChild(removeBtn);
            card.appendChild(actions);

            const canvas = document.createElement('canvas');
            const img = new Image();
            img.src = data.thumbnailUrl;
            img.onload = () => { canvas.width = img.width; canvas.height = img.height; canvas.getContext('2d').drawImage(img, 0, 0); };
            canvas.style.width = '100%';
            canvas.style.height = 'auto';
            card.appendChild(canvas);

            const nameSpan = document.createElement('div');
            nameSpan.className = 'file__info__name';
            let displayName = data.name;
            if (displayName.length > 25) displayName = displayName.slice(0, 22) + '...';
            nameSpan.innerText = displayName;
            card.appendChild(nameSpan);

            filesContainer.appendChild(card);
        }
        initSortable();
    }

    function updateMergeButton() {
        mergeBtn.disabled = selectedFiles.length < 2;
    }

    async function performMerge() {
        if (selectedFiles.length < 2) { showMessage('Додайте принаймні 2 PDF-файли', 'error'); return; }
        mergeBtn.disabled = true;
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 15 + 5;
            if (progress >= 95) { progress = 95; clearInterval(interval); }
            progressBar.style.width = `${Math.min(progress, 95)}%`;
        }, 150);

        const formData = new FormData();
        for (let item of selectedFiles) formData.append('files', item.file);
        try {
            const response = await fetch('/api/pdf/merge', { method: 'POST', body: formData });
            clearInterval(interval);
            if (response.ok) {
                progressBar.style.width = '100%';
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'merged_result.pdf';
                a.click();
                URL.revokeObjectURL(url);
                showMessage('✅ PDF успішно об\'єднано!', 'success');
                setTimeout(() => {
                    if (confirm('Очистити список файлів?')) {
                        selectedFiles = [];
                        uploader.style.display = 'block';
                        filesContainer.style.display = 'none';
                        addMoreBtn.style.display = 'none';
                        renderFilesGrid();
                        updateMergeButton();
                    }
                }, 500);
            } else throw new Error(await response.text() || 'Помилка сервера');
        } catch (err) { showMessage(`❌ Помилка: ${err.message}`, 'error'); }
        finally { setTimeout(() => { progressContainer.style.display = 'none'; mergeBtn.disabled = selectedFiles.length < 2; }, 1000); }
    }

    // Обробники подій
    uploader.addEventListener('click', () => fileInput.click());
    uploader.addEventListener('dragover', (e) => { e.preventDefault(); uploader.classList.add('drag-over'); });
    uploader.addEventListener('dragleave', () => { uploader.classList.remove('drag-over'); });
    uploader.addEventListener('drop', async (e) => { e.preventDefault(); uploader.classList.remove('drag-over'); const files = Array.from(e.dataTransfer.files); if (files.length) await addFiles(files); });
    fileInput.addEventListener('change', async (e) => { const files = Array.from(e.target.files); if (files.length) await addFiles(files); fileInput.value = ''; });
    mergeBtn.addEventListener('click', performMerge);

    // Кнопка "Додати ще файли" – відкриває діалог вибору файлів
    if (addMoreBtn) {
        addMoreBtn.addEventListener('click', () => {
            fileInput.click();
        });
    }
</script>
</body>
</html>
